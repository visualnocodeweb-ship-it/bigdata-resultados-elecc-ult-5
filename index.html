<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Electorales</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 2rem;
        }
        .chart-container {
            margin-top: 2rem;
            position: relative; /* Needed for responsive charts */
            height: 300px; /* Set a fixed height */
            width: 100%;
        }
        .back-btn {
            display: none; /* Hidden by default */
        }
        .main-title {
            margin-bottom: 2rem;
            border-bottom: 2px solid #ccc;
            padding-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center main-title">BiG Data Elecciones SMA - Resultados</h1>

        <div class="text-center">
            <button id="load-aggregated-data-btn" class="btn btn-success btn-lg mb-3">Mesas Resultados 5 elecciones</button>
            <button id="back-btn-aggregated" class="btn btn-secondary mt-2 back-btn">Volver</button>
        </div>
        <div id="aggregated-data-container" class="accordion"></div>

        <hr class="my-3">

        <div class="dropdown text-center">
            <button class="btn btn-secondary dropdown-toggle btn-lg" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                Seleccionar Elección
            </button>
            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                <li><a class="dropdown-item" href="#" id="load-data-2013-btn">Generales Dip-Sen 2013</a></li>
                <li><a class="dropdown-item" href="#" id="load-data-2017-btn">Generales Dip 2017</a></li>
                <li><a class="dropdown-item" href="#" id="load-data-2021-btn">Generales Diputados 2021</a></li>
                <li><a class="dropdown-item" href="#" id="load-data-paso-2021-btn">Diputados PASO 2021</a></li>
                <li><a class="dropdown-item" href="#" id="load-data-2023-btn">Diputados 2023</a></li>
            </ul>
        </div>

        <div class="text-center">
            <button id="back-btn" class="btn btn-secondary mt-2 back-btn">Volver</button>
        </div>
        <div id="chart-container" class="chart-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
